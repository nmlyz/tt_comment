<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OBS オーバーレイ</title>

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-width: 200px !important;
            height: 100vh !important;
            min-height: 0 !important;
            overflow: hidden !important;
        }

        .usernamelink {
            color: rgb(102, 143, 217) !important;
        }

        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        .eventcontainer > div {
            margin-top: 5px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script>
        window.settings = Object.fromEntries(
            new URLSearchParams(location.search)
        );

        window.addEventListener('load', () => {

            if (window.settings.fontColor) {
                $('body').css('color', window.settings.fontColor);
            }

            if (window.settings.bgColor) {
                $('body').css('background-color', window.settings.bgColor);
            }

            if (window.settings.fontSize) {
                $('body').css('font-size', window.settings.fontSize);
            }

        });
    </script>

    <script src="connection.js"></script>
    <script src="app.js"></script>

</head>

<body>

    <table class="splitstatetable">
        <tbody>
            <tr>
                <td>
                    <pre id="stateText"></pre>
                </td>

                <td>
                    <div id="roomStats"></div>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="eventcontainer"></div>

</body>
</html>
