    <meta charset="UTF-8">

    <title>TikTok LIVE コメントビューアー|コメビュ</title>

    <!-- 既存スクリプトはそのまま -->
    <script src="connection.js"></script>
    <script src="app.js"></script>

    <script>
        function generateOverlay() {
            let username = $('#uniqueIdInput').val();
            let url = `/obs.html?username=${username}&showLikes=1&showChats=1&showGifts=1&showFollows=1&showJoins=1&bgColor=rgb(24,23,28)&fontColor=rgb(227,229,235)&fontSize=1.3em`;

            if(username) {
                window.open(url, '_blank');
            } else {
                alert("ユーザーIDを入力してください。");
            }
        }
    </script>

    <script>
        /*
         * ============================================================
         * 追加処理
         * ============================================================
         *
         * 1. URLの ?username=xxx を入力欄へ反映
         * 2. username が存在する場合は自動接続
         * 3. 同じコメントが重複して表示された場合に削除
         *
         * connection.js / app.js は変更しません。
         * ============================================================
         */

        (function () {
            'use strict';

            /*
             * --------------------------------------------------------
             * URLパラメーターからユーザー名を取得
             * --------------------------------------------------------
             */
            function getUsernameFromQuery() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const username = params.get('username');

                    if (!username) {
                        return '';
                    }

                    return username.trim();
                } catch (e) {
                    console.error('[HTML] username query error:', e);
                    return '';
                }
            }


            /*
             * --------------------------------------------------------
             * ユーザー名を入力欄へセット
             * --------------------------------------------------------
             */
            function setUsernameFromQuery() {
                const username = getUsernameFromQuery();

                if (!username) {
                    return false;
                }

                const input = document.getElementById('uniqueIdInput');

                if (!input) {
                    return false;
                }

                input.value = username;

                /*
                 * inputイベントも発生させる。
                 * 既存JS側でinput/changeイベントを監視していても
                 * 可能な限りそのまま動作するようにする。
                 */
                try {
                    input.dispatchEvent(new Event('input', {
                        bubbles: true
                    }));

                    input.dispatchEvent(new Event('change', {
                        bubbles: true
                    }));
                } catch (e) {
                    console.error('[HTML] input event error:', e);
                }

                return true;
            }


            /*
             * --------------------------------------------------------
             * 自動接続
             * --------------------------------------------------------
             */
            function autoConnect() {
                const username = getUsernameFromQuery();

                if (!username) {
                    return;
                }

                const button = document.getElementById('connectButton');

                if (!button) {
                    return;
                }

                /*
                 * connection.js / app.js の読み込みや
                 * DOM初期化が終わるまで少し待つ。
                 */
                setTimeout(function () {
                    try {
                        button.click();
                    } catch (e) {
                        console.error('[HTML] auto connect error:', e);
                    }
                }, 300);
            }


            /*
             * --------------------------------------------------------
             * コメント重複削除
             * --------------------------------------------------------
             *
             * 同じコメントが短時間に複数生成された場合、
             * チャット欄に同一内容が3つ以上並ぶケースを除去。
             *
             * 既存の app.js / connection.js の処理には触れず、
             * DOMに追加された後のコメントだけを監視する。
             * --------------------------------------------------------
             */

            const duplicateState = new WeakMap();

            function getTextForDuplicateCheck(element) {
                if (!element) {
                    return '';
                }

                /*
                 * コメント要素の内部テキストを取得。
                 * 前後の空白・改行は比較時に無視。
                 */
                return (element.textContent || '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }


            function removeDuplicateComments(container) {
                if (!container) {
                    return;
                }

                /*
                 * チャットコンテナ直下の要素を確認。
                 *
                 * h3.containerheader はコメントではないので除外。
                 */
                const children = Array.from(container.children);

                if (children.length < 2) {
                    return;
                }

                const seen = new Map();

                /*
                 * 最新側を残すため、後ろから確認。
                 */
                for (let i = children.length - 1; i >= 0; i--) {
                    const element = children[i];

                    if (!element || element.tagName === 'H3') {
                        continue;
                    }

                    const text = getTextForDuplicateCheck(element);

                    if (!text) {
                        continue;
                    }

                    /*
                     * コメントだけでなく、
                     * ユーザー名・時刻などがDOMに含まれている場合は
                     * 完全一致した場合のみ重複と判断。
                     */
                    if (seen.has(text)) {
                        const previous = seen.get(text);

                        /*
                         * 同じ内容が存在した場合、
                         * 古い方を削除。
                         */
                        try {
                            element.remove();
                        } catch (e) {
                            if (element.parentNode) {
                                element.parentNode.removeChild(element);
                            }
                        }
                    } else {
                        seen.set(text, element);
                    }
                }
            }


            /*
             * --------------------------------------------------------
             * チャット欄監視
             * --------------------------------------------------------
             */
            function setupDuplicateObserver() {
                const container = document.querySelector('.chatcontainer');

                if (!container) {
                    return;
                }

                /*
                 * 初期状態にも重複があれば処理。
                 */
                removeDuplicateComments(container);

                const observer = new MutationObserver(function (mutations) {
                    let changed = false;

                    for (const mutation of mutations) {
                        if (
                            mutation.type === 'childList' &&
                            (
                                mutation.addedNodes.length > 0 ||
                                mutation.removedNodes.length > 0
                            )
                        ) {
                            changed = true;
                            break;
                        }
                    }

                    if (!changed) {
                        return;
                    }

                    /*
                     * app.js側が連続してDOMを更新する可能性があるため、
                     * 同一イベント内で何度も処理しない。
                     */
                    if (duplicateState.has(container)) {
                        return;
                    }

                    duplicateState.set(container, true);

                    setTimeout(function () {
                        duplicateState.delete(container);
                        removeDuplicateComments(container);
                    }, 0);
                });

                observer.observe(container, {
                    childList: true,
                    subtree: false
                });
            }


            /*
             * --------------------------------------------------------
             * 初期化
             * --------------------------------------------------------
             */
            function initialize() {
                setUsernameFromQuery();

                setupDuplicateObserver();

                /*
                 * usernameパラメーターがある場合だけ自動接続。
                 */
                autoConnect();
            }


            /*
             * DOM構築後に実行。
             */
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initialize);
            } else {
                initialize();
            }

        })();
    </script>
</head>

<body>
