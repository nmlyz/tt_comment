<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TikTok LIVE コメントビューアー</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"></script>

    <script src="connection.js"></script>
    <script src="app.js"></script>
</head>

<body>

    <button id="menuButton" class="menuButton">☰</button>

    <div id="viewerOverlay" class="viewerOverlay"></div>

    <aside id="viewerMenu" class="viewerMenu">
        <div class="viewerMenuHeader">
            <span>視聴者</span>
            <button id="closeViewerMenu">×</button>
        </div>

        <div id="viewerCountText" class="viewerCountText">
            視聴者数: 0
        </div>

        <div id="viewerList" class="viewerList"></div>
    </aside>

    <div class="inputArea">

        <div class="inputRow">
            <input
                type="text"
                id="uniqueIdInput"
                placeholder="ユーザーID または URL"
                autocomplete="off"
            >

            <button id="copyUrlButton">
                URLコピー
            </button>
        </div>

        <button id="connectButton">
            接続
        </button>

    </div>

    <div class="statusBar">
        <pre id="stateText"></pre>
        <div id="roomStats"></div>
    </div>

    <div class="mainContent">

        <div class="chatcontainer">
            <h3 class="containerheader">チャット</h3>
        </div>

        <div class="giftcontainer">
            <h3 class="containerheader">ギフト</h3>
        </div>

    </div>

</body>
</html>
