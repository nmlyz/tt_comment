<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>TikTok LIVE コメントビューアー</title>

    <meta name="description" content="TikTok LIVE コメントビューアー">
    <meta name="keywords" content="TikTok,Live,ライブ,コメント,コメビュ,コメントビューアー">

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script src="connection.js"></script>
    <script src="app.js"></script>
</head>

<body>

    <header class="head">
        <button id="viewerMenuButton" class="viewerMenuButton" type="button">
            ☰
        </button>
    </header>

    <div id="viewerOverlay" class="viewerOverlay"></div>

    <aside id="viewerMenu" class="viewerMenu">
        <div class="viewerMenuHeader">
            <span>視聴者</span>
            <button id="viewerMenuClose" type="button">×</button>
        </div>

        <div id="viewerCountText" class="viewerCountText">
            視聴者 0人
        </div>

        <div id="viewerList" class="viewerList"></div>
    </aside>

    <main class="page">

        <section class="topArea">

            <div class="inputFields">
                <input
                    type="text"
                    id="uniqueIdInput"
                    placeholder="ユーザーIDかURL を入力..."
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                >

                <button id="copyUrlButton" type="button">
                    URLコピー
                </button>
            </div>

            <button id="connectButton" type="button">
                接続
            </button>

        </section>

        <section class="statusBar">
            <pre id="stateText"></pre>
            <div id="roomStats"></div>
        </section>

        <section class="mainContent">

            <div class="chatcontainer">
                <h3 class="containerheader">チャット</h3>
            </div>

            <div class="giftcontainer">
                <h3 class="containerheader">ギフト</h3>
            </div>

        </section>

    </main>

</body>
</html>
