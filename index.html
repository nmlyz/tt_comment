<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7GL4J23WD7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-7GL4J23WD7');
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TikTok LIVE コメントビューアー|コメビュ</title>

    <meta name="description" content="TikTok LIVEのコメントビューアー">
    <meta name="keywords" content="TikTok,Live,ライブ,コメント,コメビュ,コメントビューアー,コメントビューワー">

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script src="connection.js"></script>
    <script src="app.js"></script>

    <script>
        window.settings = Object.fromEntries(new URLSearchParams(location.search));
    </script>

    <script>
        function generateOverlay() {
            let username = $('#uniqueIdInput').val();

            let url = `obs.html?username=${encodeURIComponent(username)}&showLikes=1&showChats=1&showGifts=1&showFollows=1&showJoins=1&bgColor=rgb(24,23,28)&fontColor=rgb(227,229,235)&fontSize=1.3em`;

            if (username) {
                window.open(url, '_blank');
            } else {
                alert("ユーザーIDを入力してください。");
            }
        }
    </script>
</head>

<body>
    <header class="head">
        <img src="./logo.png" alt="TikTok LIVE コメントビューアー" height="32">
    </header>

    <div class="inputFields">
        <input type="text" id="uniqueIdInput" placeholder="ユーザーIDかURL を入力...">
        <button id="connectButton">接続</button>
    </div>

    <div class="statusBar">
        <pre id="stateText"></pre>
        <div id="roomStats"></div>
    </div>

    <div class="mainContent">
        <div class="chatcontainer">
            <h3 class="containerheader">チャット</h3>
        </div>

        <div class="giftcontainer">
            <h3 class="containerheader">ギフト</h3>
        </div>
    </div>

    <footer class="siteFooter">
        <a href="https://www.tiktok.com/@sacrifice_nico" target="_blank">@sacrifice_nico</a>
    </footer>

    <script>
        $(document).ready(function () {
            let username = new URLSearchParams(location.search).get('username');

            if (username) {
                $('#uniqueIdInput').val(username);
            }
        });
    </script>
</body>
</html>
