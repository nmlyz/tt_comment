<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ギフト音声テスト</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="head">
        <div style="padding: 12px; font-size: 18px;">
            🎁 ギフト音声テスト
        </div>
    </header>


    <main>

        <div
            style="
                padding: 10px;
                text-align: center;
            "
        >

            <h2>
                ギフト音声テスト
            </h2>

            <p>
                このページは app.js / connection.js を使用しません。
            </p>

            <p>
                <strong>
                    「無操作テスト」は押した後ではなく、
                    ページを開いてから何も触らない状態でも自動テストします。
                </strong>
            </p>

        </div>


        <div
            style="
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            "
        >

            <button
                id="manualTestButton"
                type="button"
            >
                🎁 今すぐ音声テスト
            </button>


            <button
                id="autoTestButton"
                type="button"
            >
                ⏱️ 5秒後に音声テスト
            </button>


            <button
                id="repeatTestButton"
                type="button"
            >
                🔊 3回連続音声テスト
            </button>

        </div>


        <div
            style="
                margin: 10px;
                padding: 12px;
                background: #2c2c2e;
                border-radius: 8px;
            "
        >

            <div>
                状態
            </div>

            <pre
                id="testStatus"
                style="
                    white-space: pre-wrap;
                    word-break: break-word;
                    margin-top: 8px;
                "
            >ページ読み込み完了</pre>

        </div>


        <div
            style="
                margin: 10px;
                padding: 12px;
                background: #2c2c2e;
                border-radius: 8px;
            "
        >

            <div>
                テストギフト
            </div>

            <div
                id="giftResult"
                style="
                    margin-top: 10px;
                "
            >
                まだテストしていません
            </div>

        </div>

    </main>


    <script src="test.js"></script>

</body>
</html>
